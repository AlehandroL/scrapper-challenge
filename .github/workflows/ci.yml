# Typecheck y suite completa en cada push y cada PR.
#
# Sin esto, las aserciones —incluidas las de `tests/architecture.test.ts`, que
# son las que impiden que la separación de capas se degrade en el tercer apuro—
# solo corrían cuando alguien se acordaba de ejecutarlas.
#
# **Los smokes quedan deliberadamente fuera.** Los cinco (`smoke:oefa`,
# `smoke:jsf`, `smoke:source`, `smoke:download`, `smoke:pj`) dependen de la red y
# golpean un sitio real: meterlos acá convertiría cada push en tráfico contra
# publico.oefa.gob.pe, que es exactamente lo que el rate limiter existe para
# evitar. Y `smoke:download` además baja documentos de varios megas. Se corren a
# mano cuando se quiere evidencia contra el sitio vivo.
#
# `smoke:pj` tiene además una razón propia: es la fuente secundaria y exige
# salida de red peruana. Desde cualquier runner de GitHub el portal contesta 403,
# así que en CI solo probaría que el bloqueo sigue ahí.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Un fallo en una versión no oculta el resultado de las otras.
      fail-fast: false
      matrix:
        # El rango que soporta el toolchain: vitest 4 declara
        # `^20.0.0 || ^22.0.0 || >=24.0.0`.
        node: ['20', '22', '24']

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` y no `install`: instala exactamente lo del lockfile y falla si
      # package.json y package-lock.json se desincronizaron.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
